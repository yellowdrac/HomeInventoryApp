# nginx config for the HomeInventory SPA.
# Serves the static Vite build and falls back to index.html so client-side
# routing (react-router) works on deep links and page refreshes.
server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Long-lived cache for fingerprinted assets emitted by Vite.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths return index.html (200), not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip for text assets.
    gzip            on;
    gzip_types      text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
