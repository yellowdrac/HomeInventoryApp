# Frontend CD: build the frontend image and publish it to GitHub Container Registry
# (GHCR) on every push to main. The public VITE_* values are injected as build args
# from repository secrets/variables (they are baked into the static bundle).
name: deploy

on:
  push:
    branches: [main]

# Required to push images to GHCR using the built-in GITHUB_TOKEN.
permissions:
  contents: read
  packages: write

jobs:
  frontend-image:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_PUBLIC_APP_URL=${{ vars.VITE_PUBLIC_APP_URL }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/homeinventory-frontend:latest
            ghcr.io/${{ github.repository_owner }}/homeinventory-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
